<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sistemaGYM · Demo</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/demo.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;900&family=Barlow:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Material Icons para íconos -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Librerías para Códigos QR -->
  <script src="./vendor/qrcode.min.js"></script>
  <script src="./vendor/html5-qrcode.min.js" type="text/javascript"></script>

  <!-- Chart.js para gráficos -->
  <script src="./vendor/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Overlay para móviles -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-logo">S</span>
        <h1 class="brand-name" id="gymNameDisplay">sistemaGYM</h1>
      </div>
      <div class="demo-label"><span></span> DEMO · DATOS DE EJEMPLO</div>
      <nav class="nav-menu">
        <button class="nav-btn active" data-view="dashboard">
          <span class="material-icons-round" aria-hidden="true">dashboard</span>
          Panel General
        </button>
        <button class="nav-btn" data-view="socios">
          <span class="material-icons-round" aria-hidden="true">groups</span>
          Socios
        </button>
        <button class="nav-btn" data-view="checkin">
          <span class="material-icons-round" aria-hidden="true">qr_code_scanner</span>
          Check-in
        </button>
        <button class="nav-btn" data-view="ventas">
          <span class="material-icons-round" aria-hidden="true">point_of_sale</span>
          Ventas del Día
        </button>
        <button class="nav-btn" data-view="reportes">
          <span class="material-icons-round" aria-hidden="true">analytics</span>
          Reportes
        </button>
        <button class="nav-btn" data-view="configuracion" id="navConfiguracion">
          <span class="material-icons-round" aria-hidden="true">settings</span>
          Configuración
        </button>
      </nav>
      <div class="user-profile" style="cursor: pointer;" id="userProfileBtn" role="button" tabindex="0" aria-label="Restablecer datos de ejemplo" title="Restablecer datos de ejemplo">
        <div class="avatar" id="sidebarAvatar">
          <span class="material-icons-round" aria-hidden="true">person</span>
        </div>
        <div class="user-info">
          <span class="user-name" id="sidebarUserName">...</span>
          <span class="user-role" id="sidebarUserRole">...</span>
        </div>
        <span class="material-icons-round" aria-hidden="true" style="margin-left:auto; color: var(--color-text-secondary);">restart_alt</span>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left" style="display: flex; align-items: center; gap: 12px;">
          <button class="mobile-menu-btn" id="mobileMenuBtn" style="display: none; background: none; border: none; color: white; cursor: pointer; padding: 4px;">
            <span class="material-icons-round" aria-hidden="true" style="font-size: 28px;">menu</span>
          </button>
          <h2 class="view-title" id="viewTitle">Panel General</h2>
        </div>
        <div class="topbar-actions">
          <div class="date-display" id="currentDate"></div>
          <button class="btn btn-outline" onclick="window.navigateTo('checkin')">
            <span class="material-icons-round" aria-hidden="true">qr_code</span> Escanear QR
          </button>
          <button class="btn btn-primary" id="btnCheckinRapido">
            <span class="material-icons-round" aria-hidden="true">add</span> Check-in Rápido
          </button>
        </div>
      </header>

      <!-- Contenedor Dinámico para Vistas -->
      <div id="viewContainer" class="view-container">
        <!-- El contenido se inyectará aquí a través de JS -->
      </div>
    </main>
  </div>

  <div id="globalModal" class="modal-overlay"></div>
  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
