<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema GYM</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Material Icons para íconos -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  
  <!-- Librerías para Códigos QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <!-- Chart.js para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Overlay para móviles -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-logo">N</span>
        <h1 class="brand-name" id="gymNameDisplay">NEXFIT</h1>
      </div>
      <nav class="nav-menu">
        <button class="nav-btn active" data-view="dashboard">
          <span class="material-icons-round">dashboard</span>
          Panel General
        </button>
        <button class="nav-btn" data-view="socios">
          <span class="material-icons-round">groups</span>
          Socios
        </button>
        <button class="nav-btn" data-view="checkin">
          <span class="material-icons-round">qr_code_scanner</span>
          Check-in
        </button>
        <button class="nav-btn" data-view="ventas">
          <span class="material-icons-round">point_of_sale</span>
          Ventas del Día
        </button>
        <button class="nav-btn" data-view="reportes">
          <span class="material-icons-round">analytics</span>
          Reportes
        </button>
        <button class="nav-btn" data-view="configuracion" id="navConfiguracion">
          <span class="material-icons-round">settings</span>
          Configuración
        </button>
      </nav>
      <div class="user-profile" style="cursor: pointer;" id="userProfileBtn" title="Cerrar Sesión">
        <div class="avatar" id="sidebarAvatar">
          <span class="material-icons-round">person</span>
        </div>
        <div class="user-info">
          <span class="user-name" id="sidebarUserName">...</span>
          <span class="user-role" id="sidebarUserRole">...</span>
        </div>
        <span class="material-icons-round" style="margin-left:auto; color: var(--color-danger); opacity:0.5;">logout</span>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left" style="display: flex; align-items: center; gap: 12px;">
          <button class="mobile-menu-btn" id="mobileMenuBtn" style="display: none; background: none; border: none; color: white; cursor: pointer; padding: 4px;">
            <span class="material-icons-round" style="font-size: 28px;">menu</span>
          </button>
          <h2 class="view-title" id="viewTitle">Panel General</h2>
        </div>
        <div class="topbar-actions">
          <div class="date-display" id="currentDate"></div>
          <button class="btn btn-outline" onclick="window.navigateTo('checkin')">
            <span class="material-icons-round">qr_code</span> Escanear QR
          </button>
          <button class="btn btn-primary" id="btnCheckinRapido">
            <span class="material-icons-round">add</span> Check-in Rápido
          </button>
        </div>
      </header>
      
      <!-- Contenedor Dinámico para Vistas -->
      <div id="viewContainer" class="view-container">
        <!-- El contenido se inyectará aquí a través de JS -->
      </div>
    </main>
  </div>
  
  <!-- Overlay de Login -->
  <div id="loginOverlay" style="position: fixed; inset: 0; background: var(--color-bg-base); z-index: 9999; display: flex; align-items: center; justify-content: center;">
      <div style="background: var(--color-bg-surface); padding: 40px; border-radius: var(--border-radius-lg); width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
          <div style="width: 80px; height: 80px; background: color-mix(in srgb, var(--color-primary) 10%, transparent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
              <span class="material-icons-round" style="font-size: 40px; color: var(--color-primary);">fitness_center</span>
          </div>
          <h2 style="margin-bottom: 5px;" class="brand-name">NEXFIT GYM</h2>
          <p style="color: var(--color-text-secondary); margin-bottom: 30px; font-size: 14px;">Inicia sesión para continuar</p>
          
          <input type="text" id="loginUser" placeholder="Usuario" style="width: 100%; box-sizing: border-box; background: var(--color-bg-base); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px 16px; border-radius: var(--border-radius-md); margin-bottom: 15px; outline: none;">
          
          <input type="password" id="loginPass" placeholder="Contraseña" style="width: 100%; box-sizing: border-box; background: var(--color-bg-base); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px 16px; border-radius: var(--border-radius-md); margin-bottom: 25px; outline: none;">
          
          <button class="btn btn-primary" id="btnLoginSubmit" style="width: 100%; justify-content: center;">INGRESAR</button>
          
          <p style="margin-top:20px; font-size:12px; color: var(--color-text-secondary);">usr: fernando | pass: 123</p>
      </div>
  </div>

  <div id="globalModal" class="modal-overlay"></div>
  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
