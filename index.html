<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema GYM</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Material Icons para íconos -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">N</span>
        <h1 class="brand-name" id="gymNameDisplay">NEXFIT</h1>
      </div>
      <nav class="nav-menu">
        <button class="nav-btn active" data-view="dashboard">
          <span class="material-icons-round">dashboard</span>
          Panel General
        </button>
        <button class="nav-btn" data-view="socios">
          <span class="material-icons-round">groups</span>
          Socios
        </button>
        <button class="nav-btn" data-view="checkin">
          <span class="material-icons-round">qr_code_scanner</span>
          Check-in
        </button>
        <button class="nav-btn" data-view="ventas">
          <span class="material-icons-round">point_of_sale</span>
          Ventas del Día
        </button>
        <button class="nav-btn" data-view="configuracion">
          <span class="material-icons-round">settings</span>
          Configuración
        </button>
      </nav>
      <div class="user-profile">
        <div class="avatar">
          <span class="material-icons-round">person</span>
        </div>
        <div class="user-info">
          <span class="user-name">Administrador</span>
          <span class="user-role">Dueño</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <h2 class="view-title" id="viewTitle">Panel General</h2>
        <div class="topbar-actions">
          <div class="date-display" id="currentDate"></div>
          <button class="btn btn-outline">
            <span class="material-icons-round">qr_code</span> Escanear QR
          </button>
          <button class="btn btn-primary">
            <span class="material-icons-round">add</span> Check-in Rápido
          </button>
        </div>
      </header>
      
      <!-- Contenedor Dinámico para Vistas -->
      <div id="viewContainer" class="view-container">
        <!-- El contenido se inyectará aquí a través de JS -->
      </div>
    </main>
  </div>
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
